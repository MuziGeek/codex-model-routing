<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">codex-model-routing：简单直做，值得才派发</title>
  <desc id="desc">策略示意：主线程沿用当前模型；简单或紧密耦合的任务直接完成，值得拆分的独立工作才交给 Luna Medium 或 Terra High，主线程验收。这不是运行记录。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#626762" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="480" rx="28" fill="#F7F4ED"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" fill="#263238">
    <g id="project-title">
      <text x="56" y="48" font-size="20" fill="#426A64" font-weight="600">CODEX SKILL / 按收益派发</text>
      <text x="56" y="109" font-size="52" font-weight="700" letter-spacing="-1.5">codex-model-routing</text>
      <text x="56" y="153" font-size="28">当前模型继续掌舵，值得拆分才派发。</text>
    </g>
    <g id="routing-connectors" fill="none" stroke="#626762" stroke-width="3" marker-end="url(#arrow)">
      <path d="M302 308 H352 V254 H404"/>
      <path d="M352 308 V372 H404"/>
      <path d="M784 254 H826 V310 H868"/>
      <path d="M784 372 H826 V310" marker-end="none"/>
    </g>
    <g id="current-main">
      <rect x="56" y="240" width="246" height="136" rx="16" fill="#263238"/>
      <text x="80" y="292" font-size="24" font-weight="700" fill="#FFFFFF">当前主模型</text>
      <text x="80" y="330" font-size="20" fill="#E5EBE8">沿用你的任务设置</text>
    </g>
    <g id="direct-path">
      <rect x="404" y="212" width="380" height="84" rx="16" fill="#E4ECE6"/>
      <text x="428" y="246" font-size="24" font-weight="700" fill="#365A53">默认直做</text>
      <text x="428" y="277" font-size="20">简单或紧密耦合的任务</text>
    </g>
    <g id="conditional-delegation">
      <rect x="404" y="330" width="380" height="84" rx="16" fill="#EFE5D5"/>
      <text x="428" y="362" font-size="23" font-weight="700" fill="#705333">值得拆分，才派发</text>
      <text x="428" y="394" font-size="24">Luna Medium · Terra High</text>
    </g>
    <g id="acceptance">
      <rect x="868" y="240" width="276" height="136" rx="16" fill="#FFFFFF" stroke="#BCCAC2" stroke-width="2"/>
      <text x="894" y="292" font-size="24" font-weight="700">主线程验收</text>
      <text x="894" y="330" font-size="20" fill="#626762">差异 + 相关测试</text>
    </g>
    <text x="56" y="452" font-size="19" fill="#626762">策略示意 · 非运行记录</text>
    <text x="1144" y="452" text-anchor="end" font-size="19" fill="#626762">高风险核心判断留在主线程</text>
  </g>
</svg>
