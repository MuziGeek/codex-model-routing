<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">codex-model-routing：Codex 的显式模型路由策略</title>
  <desc id="desc">一张路由图：Sol Max 负责规划、路由和验收；Luna Medium 处理清晰且可重复的工作；Terra High 处理日常实现；高风险或模糊任务回到 Sol；所有路径汇入验收。</desc>
  <rect width="1200" height="420" rx="28" fill="#F7F4ED"/>
  <g fill="none" stroke="#263238" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 48H1120" stroke-width="2" opacity=".22"/>
    <path d="M882 142V164M766 164H1006M766 164V180M1006 164V180M766 264V288M1006 264V288" stroke="#8A6F47" stroke-width="4"/>
    <path d="M886 142C886 218 1100 190 1100 264C1100 294 1022 300 1022 300" stroke="#B56B4A" stroke-width="3"/>
    <path d="M1022 300l12-8M1022 300l12 8" stroke="#B56B4A" stroke-width="3"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#263238">
    <text x="80" y="92" font-size="20" font-weight="700" letter-spacing="2" fill="#8A6F47">CODEX SKILL · 显式派发</text>
    <text x="80" y="156" font-size="54" font-weight="750" letter-spacing="-1.5">codex-model-routing</text>
    <text x="80" y="205" font-size="27" font-weight="600">为有意图的 Codex 子代理派发提供</text>
    <text x="80" y="239" font-size="27" font-weight="600">可审计的本地配置与行为规则。</text>
    <text x="80" y="300" font-size="21" font-weight="650" fill="#607D7A">先审计 · 保留未知配置 · 运行时复核</text>
    <text x="80" y="348" font-size="21">默认值只提供路由基础；实际显式派发来自</text>
    <text x="80" y="378" font-size="21">直接请求或适用的 AGENTS / Skill 指令。</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(746 62)">
      <rect width="280" height="80" rx="16" fill="#263238"/>
      <text x="22" y="33" fill="#F7F4ED" font-size="26" font-weight="750">SOL MAX</text>
      <text x="22" y="61" fill="#F7F4ED" font-size="20" font-weight="600">规划 · 路由 · 验收</text>
    </g>
    <g transform="translate(656 180)">
      <rect width="220" height="84" rx="16" fill="#607D7A"/>
      <text x="20" y="34" fill="#F7F4ED" font-size="25" font-weight="750">LUNA MEDIUM</text>
      <text x="20" y="63" fill="#F7F4ED" font-size="20" font-weight="600">清晰 · 可重复</text>
    </g>
    <g transform="translate(896 180)">
      <rect width="220" height="84" rx="16" fill="#8A6F47"/>
      <text x="20" y="34" fill="#F7F4ED" font-size="25" font-weight="750">TERRA HIGH</text>
      <text x="20" y="63" fill="#F7F4ED" font-size="20" font-weight="600">日常实现</text>
    </g>
    <g transform="translate(728 300)">
      <rect width="280" height="72" rx="16" fill="#F7F4ED" stroke="#263238" stroke-width="3"/>
      <text x="22" y="30" fill="#263238" font-size="25" font-weight="750">验收</text>
      <text x="22" y="56" fill="#607D7A" font-size="20" font-weight="700">差异 · 测试 · 运行时复核</text>
    </g>
    <text x="1110" y="158" text-anchor="end" fill="#B56B4A" font-size="17" font-weight="750">高风险 / 模糊 → SOL</text>
  </g>
</svg>
