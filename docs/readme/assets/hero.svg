<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">codex-model-routing: direct first, delegate when worthwhile</title>
  <desc id="desc">Policy diagram: the main thread keeps its current model. Simple or tightly coupled work stays direct; only worthwhile independent work goes to Luna Medium or Terra High. The main thread verifies. This is not a runtime record.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#626762" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="480" rx="28" fill="#F7F4ED"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" fill="#263238">
    <g id="project-title">
      <text x="56" y="48" font-size="20" fill="#426A64" font-weight="600">CODEX SKILL / DELIBERATE DELEGATION</text>
      <text x="56" y="109" font-size="52" font-weight="700" letter-spacing="-1.5">codex-model-routing</text>
      <text x="56" y="153" font-size="28">Keep your current model. Delegate only when worthwhile.</text>
    </g>
    <g id="routing-connectors" fill="none" stroke="#626762" stroke-width="3" marker-end="url(#arrow)">
      <path d="M302 308 H352 V254 H404"/>
      <path d="M352 308 V372 H404"/>
      <path d="M784 254 H826 V310 H868"/>
      <path d="M784 372 H826 V310" marker-end="none"/>
    </g>
    <g id="current-main">
      <rect x="56" y="240" width="246" height="136" rx="16" fill="#263238"/>
      <text x="80" y="292" font-size="24" font-weight="700" fill="#FFFFFF">CURRENT MODEL</text>
      <text x="80" y="330" font-size="20" fill="#E5EBE8">Your task, your choice</text>
    </g>
    <g id="direct-path">
      <rect x="404" y="212" width="380" height="84" rx="16" fill="#E4ECE6"/>
      <text x="428" y="246" font-size="24" font-weight="700" fill="#365A53">DIRECT BY DEFAULT</text>
      <text x="428" y="277" font-size="20">Small or tightly coupled tasks</text>
    </g>
    <g id="conditional-delegation">
      <rect x="404" y="330" width="380" height="84" rx="16" fill="#EFE5D5"/>
      <text x="428" y="362" font-size="23" font-weight="700" fill="#705333">ONLY WHEN WORTHWHILE</text>
      <text x="428" y="394" font-size="24">Luna Medium · Terra High</text>
    </g>
    <g id="acceptance">
      <rect x="868" y="240" width="276" height="136" rx="16" fill="#FFFFFF" stroke="#BCCAC2" stroke-width="2"/>
      <text x="894" y="292" font-size="24" font-weight="700">MAIN VERIFIES</text>
      <text x="894" y="330" font-size="20" fill="#626762">Diff + relevant tests</text>
    </g>
    <text x="56" y="452" font-size="19" fill="#626762">POLICY DIAGRAM · Not runtime evidence</text>
    <text x="1144" y="452" text-anchor="end" font-size="19" fill="#626762">High-risk core decisions stay in main</text>
  </g>
</svg>
