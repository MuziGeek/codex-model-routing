  <title id="title">codex-model-routing: explicit model-routing policy for Codex</title>
  <desc id="desc">A routing map where Sol Max plans, routes, and verifies; Luna Medium handles clear repeatable work; Terra High handles everyday implementation; risk or ambiguity returns to Sol; all paths lead to acceptance.</desc>
