<svg xmlns="http://www.w3.org/2000/svg" width="720" height="736" viewBox="0 0 720 736" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">codex-model-routing：简单直做，值得才派发</title>
  <desc id="desc">策略示意：主线程沿用当前模型；简单或紧密耦合的任务直接完成，值得拆分的独立工作才交给 Luna Medium 或 Terra High，主线程验收。这不是运行记录。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#626762" stroke-width="1.5"/></marker></defs>
  <rect width="720" height="736" rx="28" fill="#F7F4ED"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" fill="#263238">
    <g id="project-title">
      <text x="40" y="53" font-size="26" fill="#426A64" font-weight="600">CODEX SKILL / 按收益派发</text>
      <text x="40" y="113" font-size="46" font-weight="700" letter-spacing="-1">codex-model-routing</text>
      <text x="40" y="166" font-size="32">沿用当前模型</text>
      <text x="40" y="209" font-size="32">简单直做，值得才派发</text>
    </g>
    <g id="routing-connectors" fill="none" stroke="#626762" stroke-width="3" marker-end="url(#arrow)">
      <path d="M360 338 V366 H191 V396"/>
      <path d="M360 366 H529 V396"/>
      <path d="M191 540 V570 H360 V600"/>
      <path d="M529 540 V570 H360" marker-end="none"/>
    </g>
    <g id="current-main">
      <rect x="40" y="248" width="640" height="90" rx="16" fill="#263238"/>
      <text x="360" y="285" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">当前主模型</text>
      <text x="360" y="319" text-anchor="middle" font-size="28" fill="#E5EBE8">沿用你的任务设置</text>
    </g>
    <g id="direct-path">
      <rect x="40" y="396" width="302" height="144" rx="16" fill="#E4ECE6"/>
      <text x="191" y="434" text-anchor="middle" font-size="28" font-weight="700" fill="#365A53">默认直做</text>
      <text x="191" y="477" text-anchor="middle" font-size="28">简单任务</text>
      <text x="191" y="517" text-anchor="middle" font-size="28">紧密耦合的工作</text>
    </g>
    <g id="conditional-delegation">
      <rect x="378" y="396" width="302" height="144" rx="16" fill="#EFE5D5"/>
      <text x="529" y="434" text-anchor="middle" font-size="28" font-weight="700" fill="#705333">值得才派发</text>
      <text x="529" y="477" text-anchor="middle" font-size="30">Luna Medium</text>
      <text x="529" y="517" text-anchor="middle" font-size="30">Terra High</text>
    </g>
    <g id="acceptance">
      <rect x="40" y="600" width="640" height="90" rx="16" fill="#FFFFFF" stroke="#BCCAC2" stroke-width="2"/>
      <text x="360" y="638" text-anchor="middle" font-size="32" font-weight="700">主线程验收</text>
      <text x="360" y="672" text-anchor="middle" font-size="28" fill="#626762">差异 + 相关测试</text>
    </g>
    <text x="360" y="724" text-anchor="middle" font-size="24" fill="#626762">策略示意 · 非运行记录</text>
  </g>
</svg>
