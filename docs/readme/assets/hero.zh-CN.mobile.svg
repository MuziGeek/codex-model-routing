<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">codex-model-routing：Codex 的显式模型路由策略</title>
  <desc id="desc">一张路由图：Sol Max 负责规划、路由和验收；Luna Medium 处理清晰且可重复的工作；Terra High 处理日常实现；高风险或模糊任务回到 Sol；所有路径汇入验收。</desc>
  <rect width="720" height="480" rx="28" fill="#F7F4ED"/>
  <path d="M40 42H680" fill="none" stroke="#263238" stroke-width="2" opacity=".22"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#263238">
    <text x="40" y="78" font-size="17" font-weight="700" letter-spacing="1.5" fill="#8A6F47">CODEX SKILL · 显式派发</text>
    <text x="40" y="128" font-size="44" font-weight="750" letter-spacing="-1">codex-model-routing</text>
    <text x="40" y="166" font-size="22" font-weight="600">为有意图的 Codex 子代理派发提供</text>
    <text x="40" y="194" font-size="22" font-weight="600">可审计的本地配置与行为规则。</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 274V294M190 294H530M190 294V308M530 294V308M190 380V397M530 380V397M190 397H530M360 397V408" stroke="#8A6F47" stroke-width="4"/>
    <path d="M638 308C676 280 650 250 492 250" stroke="#B56B4A" stroke-width="3"/>
    <path d="M492 250l12-8M492 250l12 8" stroke="#B56B4A" stroke-width="3"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(224 210)">
      <rect width="272" height="64" rx="16" fill="#263238"/>
      <text x="18" y="28" fill="#F7F4ED" font-size="24" font-weight="750">SOL MAX</text>
      <text x="18" y="51" fill="#F7F4ED" font-size="17" font-weight="600">规划 · 路由 · 验收</text>
    </g>
    <text x="620" y="286" text-anchor="end" fill="#B56B4A" font-size="17" font-weight="750">高风险 / 模糊 → SOL</text>
    <g transform="translate(48 308)">
      <rect width="284" height="72" rx="16" fill="#607D7A"/>
      <text x="18" y="30" fill="#F7F4ED" font-size="23" font-weight="750">LUNA MEDIUM</text>
      <text x="18" y="56" fill="#F7F4ED" font-size="17" font-weight="600">清晰 · 可重复</text>
    </g>
    <g transform="translate(388 308)">
      <rect width="284" height="72" rx="16" fill="#8A6F47"/>
      <text x="18" y="30" fill="#F7F4ED" font-size="23" font-weight="750">TERRA HIGH</text>
      <text x="18" y="56" fill="#F7F4ED" font-size="17" font-weight="600">日常实现</text>
    </g>
    <g transform="translate(224 408)">
      <rect width="272" height="54" rx="15" fill="#F7F4ED" stroke="#263238" stroke-width="3"/>
      <text x="18" y="24" fill="#263238" font-size="21" font-weight="750">验收</text>
      <text x="18" y="44" fill="#607D7A" font-size="15" font-weight="700">差异 · 测试 · 运行时复核</text>
